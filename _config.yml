title: SSMS Claude Chat
tagline: AI assistant for SQL Server Management Studio (SSMS)
description: >-
  SSMS Claude Chat is a free add-in that puts Claude AI inside SQL Server Management Studio (SSMS 21 and 22).
  Ask questions about your database in plain English, get stored procedures explained, fix slow queries and draw
  database diagrams. Nothing changes in your database until you click Yes.
url: https://tanmays0406.github.io
baseurl: /ssms-claude-chat
permalink: pretty
markdown: kramdown
lang: en

# The download site always serves the newest setup, so this never needs updating.
download_url: https://ssmsclaudechat.azurewebsites.net/

repository_url: https://github.com/TanmayS0406/ssms-claude-chat
issues_url: https://github.com/TanmayS0406/ssms-claude-chat/issues
sponsor_url: https://github.com/sponsors/TanmayS0406
