# Copies the latest security report into the site. The extension's private repository scans every change and
# daily, then publishes the summary (results and finding counts, never details) next to the downloads in blob
# storage, where the download function serves it; this copies it into _data/ and security/ for
# https://tanmays0406.github.io/ssms-claude-chat/security/.
name: Update security report

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-security-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # commit the report
      pages: write      # start a Pages build (pushes made with the workflow token don't start one)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # zizmor: ignore[artipacked] the last step pushes the report with it

      - name: Download the report
        env:
          BASE: https://ssmsclaudechat-dl.azurewebsites.net/security
        run: |
          mkdir -p _data security
          curl -fsSL "$BASE/security.json" -o /tmp/security.json
          jq -e '.generated and .checks' /tmp/security.json > /dev/null   # only take a well-formed report
          mv /tmp/security.json _data/security.json
          curl -fsSL "$BASE/badge.json" -o security/badge.json
          curl -fsSL "$BASE/banner.svg" -o security/banner.svg
          curl -fsSL "$BASE/sbom.spdx.json" -o security/sbom.spdx.json || rm -f security/sbom.spdx.json

      - name: Commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _data/security.json security
          if git diff --cached --quiet; then echo "Report unchanged."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Security report $(jq -r .generated _data/security.json)"
          git push -q
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
